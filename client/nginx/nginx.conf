# ─────────────────────────────────────────────────────────────────
# Nginx Config — CLIENT SIDE (Optional, if using Nginx on client)
# ─────────────────────────────────────────────────────────────────
# This is OPTIONAL. Use this if you want to run Nginx on the client
# PC to serve the built Next.js frontend and proxy API calls.
#
# For simple dev/demo use: just run `npm run start` in frontend/.
# ─────────────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {
    # ── Logging ───────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Upstream — EurekaX Server on LAN ─────────────────────────
    upstream eurekax_server {
        server 192.168.1.100:443;   # <-- Change to your server's LAN IP
    }

    # ── Server Block — Client App ─────────────────────────────────
    server {
        listen 3000;
        server_name localhost;

        # Serve Next.js static build
        root /app/frontend/out;
        index index.html;

        # ── API proxy to server (forwarded with TLS) ──────────────
        location /api/ {
            proxy_pass https://eurekax_server/api/;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
            proxy_ssl_protocols TLSv1.3;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pass JWT token through
            proxy_pass_header Authorization;
        }

        # ── WebSocket proxy ───────────────────────────────────────
        location /ws/ {
            proxy_pass https://eurekax_server/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
        }

        # ── Frontend SPA fallback ─────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Security Headers ──────────────────────────────────────
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }
}
